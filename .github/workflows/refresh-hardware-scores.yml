name: Refresh PCM hardware scores

on:
  schedule:
    - cron: '0 0 1 * *'  # run at 00:00 UTC on the first day of every month
  workflow_dispatch: {}

jobs:
  refresh-scores:
    name: Refresh CPU & GPU benchmark scores
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install scraper dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pcmasterrace/scores/requirements.txt

      - name: Run CPU score refresh
        working-directory: pcmasterrace/scores
        run: python cpu.py

      - name: Run GPU score refresh
        working-directory: pcmasterrace/scores
        run: python gpu.py

      - name: Commit updated score files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pcmasterrace/scores/cpu.json pcmasterrace/scores/gpu.json
          if git diff --cached --quiet; then
            echo "No score changes to commit."
          else
            git commit -m "Refresh pcmasterrace hardware scores"
            git push
          fi
